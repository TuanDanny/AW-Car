name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check repository
        run: python tools/check_repo.py
      - name: Check PR branch
        if: github.event_name == 'pull_request'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: python tools/check_repo.py --feature-branch "$SOURCE_BRANCH"
      - name: Test repository checks
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git show --format= --check HEAD

  fpga-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install simulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog yosys
      - name: Run self-checking RTL tests
        run: python tools/run_fpga_tests.py --full-timing --timeout 1800
      - name: Check generic Gowin synthesis
        run: |
          yosys -Q -T -l fpga/build/encoder-synth.log -s fpga/synth_encoder.ys
          yosys -Q -T -l fpga/build/pwm-synth.log -s fpga/synth_pwm.ys
          yosys -Q -T -l fpga/build/link-synth.log -s fpga/synth_link.ys
          yosys -Q -T -l fpga/build/drive-synth.log -s fpga/synth_drive.ys
