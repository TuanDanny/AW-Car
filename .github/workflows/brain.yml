name: Brain host tests

on:
  push:
    branches: [feat/f03-xiaozhi-ai]
    paths:
      - firmware/brain/**
      - .github/workflows/brain.yml
  pull_request:
    branches: [main]
    paths:
      - firmware/brain/**
      - .github/workflows/brain.yml

permissions:
  contents: read

jobs:
  xiaozhi-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test Xiaozhi build and release tools
        working-directory: firmware/brain
        run: python -X utf8 -B -m unittest discover -s scripts/tests -v
