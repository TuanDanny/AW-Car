00" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">USB programming/service clearance</text><rect x="88.0" y="766.0" width="1417.0" height="107.0" rx="12" fill="#FFF6E9" stroke="#E3BC77" stroke-width="1" opacity="1"/><text x="113.0" y="800.0" fill="#80572B" font-size="19" font-weight="700" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">SEPARATE BOARD 2: PDB / FUSE / POWER SPLIT  (36 x 25 mm concept envelope)</text><text x="113.0" y="830.0" fill="#7B613D" font-size="16" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">Battery current uses rated wiring/connectors and selected copper stack-up; do not carry four motors through GPIO headers.</text><text x="113.0" y="856.0" fill="#7B613D" font-size="15" font-weight="400" text-anchor="start" font-family="Segoe UI, Arial, sans-serif">No 2S raw supply under ESP32 antenna; no traces routed underneath the RF keepout; driver bulk capacitors near VM/GND.</text></svg>